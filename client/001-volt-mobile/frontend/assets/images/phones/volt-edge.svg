<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-label="Volt Edge limited edition smartphone">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2238"/>
      <stop offset="0.5" stop-color="#171022"/>
      <stop offset="1" stop-color="#0a0710"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a3d"/>
      <stop offset="0.5" stop-color="#181030"/>
      <stop offset="1" stop-color="#0a0814"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1a4d"/>
      <stop offset="1" stop-color="#120a24"/>
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="500" rx="230" ry="300" fill="url(#halo)"/>

  <rect x="150" y="80" width="300" height="740" rx="58" fill="url(#body)" stroke="#453355" stroke-width="2"/>
  <rect x="162" y="94" width="276" height="712" rx="44" fill="url(#screen)"/>
  <ellipse cx="300" cy="420" rx="120" ry="150" fill="url(#halo)"/>

  <rect x="196" y="118" width="104" height="140" rx="28" fill="#120d1c" stroke="#3d2c52" stroke-width="1.5"/>
  <circle cx="222" cy="152" r="16" fill="url(#lens)" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="274" cy="152" r="16" fill="url(#lens)"/>
  <circle cx="248" cy="210" r="13" fill="url(#lens)"/>

  <text x="300" y="520" font-family="Segoe UI, system-ui, sans-serif" font-size="46" font-weight="700" fill="#f3efff" text-anchor="middle" letter-spacing="6">VOLT</text>
  <text x="300" y="560" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#c4b5fd" text-anchor="middle" letter-spacing="6">EDGE</text>
  <text x="300" y="588" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#8b6fb8" text-anchor="middle" letter-spacing="3">LIMITED EDITION</text>
  <circle cx="300" cy="800" r="6" fill="#a78bfa" opacity="0.8"/>

  <rect x="126" y="360" width="10" height="56" rx="5" fill="#3d2c52"/>
  <rect x="126" y="440" width="10" height="56" rx="5" fill="#3d2c52"/>
  <rect x="126" y="620" width="10" height="90" rx="5" fill="#3d2c52"/>
  <rect x="464" y="400" width="10" height="80" rx="5" fill="#3d2c52"/>

  <rect x="152" y="82" width="296" height="736" rx="56" fill="url(#shine)" pointer-events="none"/>
</svg>