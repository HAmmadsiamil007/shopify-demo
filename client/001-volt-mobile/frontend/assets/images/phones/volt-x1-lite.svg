<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-label="Volt X1 Lite smartphone">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d8e0"/>
      <stop offset="0.45" stop-color="#8f8f9c"/>
      <stop offset="1" stop-color="#4a4a56"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123341"/>
      <stop offset="0.5" stop-color="#0c2230"/>
      <stop offset="1" stop-color="#080e16"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14404a"/>
      <stop offset="1" stop-color="#0a1c22"/>
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="500" rx="230" ry="300" fill="url(#halo)"/>

  <rect x="150" y="80" width="300" height="740" rx="58" fill="url(#body)" stroke="#6a6a78" stroke-width="2"/>
  <rect x="162" y="94" width="276" height="712" rx="44" fill="url(#screen)"/>
  <ellipse cx="300" cy="420" rx="120" ry="150" fill="url(#halo)"/>

  <rect x="196" y="118" width="104" height="140" rx="28" fill="#101016" stroke="#3c3c48" stroke-width="1.5"/>
  <circle cx="222" cy="152" r="16" fill="url(#lens)"/>
  <circle cx="274" cy="152" r="16" fill="url(#lens)"/>

  <text x="300" y="520" font-family="Segoe UI, system-ui, sans-serif" font-size="46" font-weight="700" fill="#f0fffb" text-anchor="middle" letter-spacing="6">VOLT</text>
  <text x="300" y="560" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#99f6e4" text-anchor="middle" letter-spacing="4">X1 LITE</text>
  <circle cx="300" cy="800" r="6" fill="#5eead4" opacity="0.8"/>

  <rect x="126" y="360" width="10" height="56" rx="5" fill="#6a6a78"/>
  <rect x="126" y="440" width="10" height="56" rx="5" fill="#6a6a78"/>
  <rect x="126" y="620" width="10" height="90" rx="5" fill="#6a6a78"/>
  <rect x="464" y="400" width="10" height="80" rx="5" fill="#6a6a78"/>

  <rect x="152" y="82" width="296" height="736" rx="56" fill="url(#shine)" pointer-events="none"/>
